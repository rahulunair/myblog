<div class="quarto-about-broadside column-page">
  <div class="about-main">
    <div
      class="about-entity"
      style="background-image: url('<%= about.image %>')"
      <% if (about['image-alt']) { %>
      role="img"
      aria-label="<%= about['image-alt'] %>"
      <% } %>
    ></div>
    <div class="about-contents"><%= about.title %><%= about.body %></div>
  </div>
  <% if (about.links) { %>
  <div class="about-links">
    <% for (const link of about.links) { %>
    <a href="<%= link.href %>" class="about-link" rel="<%= link.rel %>" target="<%= link.target %>">
      <% if (link.icon) { %><i class="bi <%= link.icon %>"></i><% } %>
      <span class="about-link-text"><%= link.text %></span>
    </a>
    <% } %>
  </div>
  <% } %>
</div>
