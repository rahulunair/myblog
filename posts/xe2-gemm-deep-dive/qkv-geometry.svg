<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Gated QKV geometry becomes two rank-local GEMMs</title>
  <desc id="desc">An input activation x with M rows and hidden width 2048 multiplies a weight matrix with K equal to 2048 and N output channels. At tensor parallelism one, sixteen query-head-width Q streams, sixteen gate streams, two key heads, and two value heads produce N equal to 9216. At tensor parallelism two, each rank owns eight Q streams, eight gate streams, one key head, and one value head, producing N equal to 4608. The ordered M sweep is 1, 8, 32, 128, 512, 4,096, and 16,384, not a numerically scaled axis.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#243447" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#243447" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="#fffdf7"/>
  <path d="M32 36 Q300 29 580 36 T1168 35" fill="none" stroke="#243447" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <text x="54" y="82" font-family="Verdana, sans-serif" font-size="30" font-weight="700" fill="#243447">One packed QKV-plus-gate projection, two rank-local shapes</text>
  <text x="56" y="116" font-family="Verdana, sans-serif" font-size="17" fill="#243447">The gated query stream changes N; the scheduler changes M.</text>
  <g filter="url(#soft-shadow)">
    <rect x="58" y="190" width="235" height="150" rx="18" fill="#d9f8ef" stroke="#06d6a0" stroke-width="5"/>
    <text x="88" y="242" font-family="monospace" font-size="27" font-weight="700" fill="#243447">x[M, 2048]</text>
    <text x="88" y="278" font-family="Verdana, sans-serif" font-size="17" fill="#243447">one row per token</text>
    <text x="88" y="308" font-family="Verdana, sans-serif" font-size="16" fill="#243447">BF16 activation</text>
  </g>
  <text x="332" y="272" font-family="Verdana, sans-serif" font-size="44" font-weight="700" fill="#243447">×</text>
  <g filter="url(#soft-shadow)">
    <rect x="405" y="165" width="270" height="200" rx="18" fill="#eee9ff" stroke="#8e6cff" stroke-width="5"/>
    <text x="445" y="225" font-family="monospace" font-size="27" font-weight="700" fill="#243447">W[2048, N]</text>
    <text x="445" y="262" font-family="Verdana, sans-serif" font-size="17" fill="#243447">multiplication orientation</text>
    <text x="445" y="296" font-family="Verdana, sans-serif" font-size="16" fill="#243447">Q + output gate + K + V</text>
    <text x="445" y="328" font-family="Verdana, sans-serif" font-size="16" fill="#243447">framework may store [N, K]</text>
  </g>
  <path d="M295 264 C330 264 350 264 398 264" fill="none" stroke="#243447" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M684 264 C724 264 730 207 773 207" fill="none" stroke="#243447" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M684 264 C724 264 730 390 773 390" fill="none" stroke="#243447" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g filter="url(#soft-shadow)">
    <rect x="790" y="145" width="350" height="132" rx="18" fill="#fff0c5" stroke="#ffd166" stroke-width="5"/>
    <text x="825" y="185" font-family="Verdana, sans-serif" font-size="18" font-weight="700" fill="#243447">TP1 • one rank</text>
    <text x="825" y="222" font-family="monospace" font-size="25" font-weight="700" fill="#243447">N = 9,216</text>
    <text x="825" y="252" font-family="Verdana, sans-serif" font-size="16" fill="#243447">Q + gate: 2×16, K: 2, V: 2</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="790" y="330" width="350" height="132" rx="18" fill="#ffe1e4" stroke="#f25f5c" stroke-width="5"/>
    <text x="825" y="370" font-family="Verdana, sans-serif" font-size="18" font-weight="700" fill="#243447">TP2 • each rank</text>
    <text x="825" y="407" font-family="monospace" font-size="25" font-weight="700" fill="#243447">N = 4,608</text>
    <text x="825" y="437" font-family="Verdana, sans-serif" font-size="16" fill="#243447">Q + gate: 2×8, K: 1, V: 1</text>
  </g>
  <text x="58" y="414" font-family="Verdana, sans-serif" font-size="17" font-weight="700" fill="#243447">M is the experiment's moving dimension (ordered, not to scale)</text>
  <path d="M60 478 Q180 470 300 478 T540 478 T780 478 T1125 478" fill="none" stroke="#168aad" stroke-width="4" stroke-linecap="round"/>
  <g font-family="monospace" font-size="17" fill="#243447" text-anchor="middle">
    <circle cx="70" cy="478" r="9" fill="#06d6a0"/><text x="70" y="520">1</text>
    <circle cx="230" cy="477" r="9" fill="#06d6a0"/><text x="230" y="520">8</text>
    <circle cx="380" cy="478" r="9" fill="#ffd166"/><text x="380" y="520">32</text>
    <circle cx="530" cy="477" r="9" fill="#ffd166"/><text x="530" y="520">128</text>
    <circle cx="680" cy="478" r="9" fill="#8e6cff"/><text x="680" y="520">512</text>
    <circle cx="855" cy="478" r="9" fill="#8e6cff"/><text x="855" y="520">4,096</text>
    <circle cx="1080" cy="478" r="9" fill="#f25f5c"/><text x="1080" y="520">16,384</text>
  </g>
  <text x="58" y="570" font-family="Verdana, sans-serif" font-size="16" fill="#243447">decode-like shapes</text>
  <text x="522" y="570" font-family="Verdana, sans-serif" font-size="16" fill="#243447">transition</text>
  <text x="955" y="570" font-family="Verdana, sans-serif" font-size="16" fill="#243447">prefill-like shapes</text>
</svg>
