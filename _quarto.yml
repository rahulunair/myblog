project:
  type: website
  resources:
    - _redirects
    - not_found.png
    - assets/**

website:
  title: "Technical ramblings"
  description: "Rahul Nair (unrahul) writes measured notes on Intel GPUs, XPU kernels, model serving, Rust, and machine learning."
  site-url: https://blog.rahul.onl
  favicon: posts/images/favicon.ico
  image: /assets/site-card.png
  image-alt: "Technical ramblings: Intel GPUs, kernels, model serving, Rust, and machine learning."
  open-graph: true
  twitter-card:
    creator: "@108brushes"
  navbar:
    right:
      - text: Topics
        href: /#topics
      - text: About
        href: about.qmd
      - icon: github
        aria-label: GitHub
        href: https://github.com/rahulunair
      - text: Hugging Face
        aria-label: Hugging Face
        href: https://huggingface.co/ulkaa
      - icon: twitter-x
        aria-label: X / Twitter
        href: https://x.com/108brushes
      - icon: rss
        aria-label: RSS feed
        href: index.xml

format:
  html:
    canonical-url: true
    include-in-header: seo/site-schema.html
    filters:
      - filters/blogposting.lua
    theme:
      # listing dark first makes it the default on load; readers can still
      # toggle, and their choice persists in localStorage
      dark: [darkly, theme-base.scss, theme-dark.scss]
      light: [cosmo, theme-base.scss, theme-light.scss]
    highlight-style: github
    code-copy: true
    code-overflow: wrap
    toc: true
    anchor-sections: true
    smooth-scroll: true
