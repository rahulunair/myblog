project:
  type: website
  resources:
    - _redirects

website:
  title: "Technical ramblings"
  description: "Notes on systems, Rust, Python and running AI workloads on Intel GPUs."
  site-url: https://blog.rahul.onl
  open-graph: true
  twitter-card:
    creator: "@108brushes"
  navbar:
    right:
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/rahulunair
      - icon: twitter-x
        href: https://x.com/108brushes
      - icon: rss
        href: index.xml

format:
  html:
    theme:
      # listing dark first makes it the default on load; readers can still
      # toggle, and their choice persists in localStorage
      dark: [darkly, theme-base.scss, theme-dark.scss]
      light: [cosmo, theme-base.scss, theme-light.scss]
    highlight-style: github
    code-copy: true
    code-overflow: wrap
    toc: true
    anchor-sections: true
    smooth-scroll: true
